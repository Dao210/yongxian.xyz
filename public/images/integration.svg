<svg width="100%" height="100%" viewBox="0 0 720 300" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="720" height="300" fill="#f8f9fa"/>
  
  <!-- Existing System Box -->
  <rect x="50" y="100" width="200" height="100" rx="10" fill="#3498db" opacity="0.1"/>
  <text x="150" y="160" text-anchor="middle" fill="#2c3e50" font-family="Arial" font-size="16">现有系统</text>
  
  <!-- Digital Employee Box -->
  <rect x="450" y="100" width="200" height="100" rx="10" fill="#e74c3c" opacity="0.1"/>
  <text x="550" y="160" text-anchor="middle" fill="#2c3e50" font-family="Arial" font-size="16">AI工作台</text>
  
  <!-- Connection Lines -->
  <path d="M250 150 L450 150" stroke="#3498db" stroke-width="4" stroke-dasharray="10,5"/>
  
  <!-- Integration Arrows -->
  <path d="M300 150 L350 120 L400 150 L350 180 Z" fill="#3498db"/>
  <path d="M400 150 L350 120 L300 150 L350 180 Z" fill="#3498db"/>
  
  <!-- Training Flow -->
  <circle cx="350" cy="250" r="30" fill="#2ecc71" opacity="0.1"/>
  <text x="350" y="260" text-anchor="middle" fill="#2c3e50" font-family="Arial" font-size="14">团队培训</text>
  
  <!-- Connection to Training -->
  <path d="M350 180 L350 220" stroke="#2ecc71" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Decorative Elements -->
  <circle cx="250" cy="150" r="5" fill="#3498db"/>
  <circle cx="450" cy="150" r="5" fill="#e74c3c"/>
  
  <!-- Title -->
  <text x="350" y="50" text-anchor="middle" fill="#2c3e50" font-family="Arial" font-size="24" font-weight="bold">系统集成与团队协作</text>
</svg>
