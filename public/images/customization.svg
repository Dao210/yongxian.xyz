<svg width="100%" height="100%" viewBox="0 0 960 400" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="960" height="400" fill="#f8fafc"/>
  
  <!-- 微妙的网格背景 -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3B82F6" stroke-width="0.5" opacity="0.05"/>
  </pattern>
  <rect width="960" height="400" fill="url(#grid)"/>
  
  <!-- 中央圆形区域 -->
  <circle cx="450" cy="200" r="120" fill="#EFF6FF"/>
  
  <!-- 中央AI工作台图标 - 简化设计 -->
  <g transform="translate(450, 200)">
    <!-- 机器人头部 -->
    <circle cx="0" cy="-40" r="30" fill="#3B82F6" opacity="0.9"/>
    <!-- 机器人身体 -->
    <rect x="-35" y="0" width="70" height="80" rx="10" fill="#3B82F6" opacity="0.8"/>
    <!-- 眼睛 -->
    <circle cx="-12" cy="-45" r="5" fill="white"/>
    <circle cx="12" cy="-45" r="5" fill="white"/>
    <!-- 面板 -->
    <rect x="-20" y="20" width="40" height="25" rx="3" fill="white" opacity="0.9"/>
    <!-- 面板指示灯 -->
    <circle cx="-10" cy="30" r="3" fill="#10B981"/>
    <circle cx="0" cy="30" r="3" fill="#F59E0B"/>
    <circle cx="10" cy="30" r="3" fill="#EF4444"/>
  </g>
  
  <!-- 定制元素 - 简化齿轮 -->
  <g transform="translate(450, 200)">
    <circle cx="0" cy="0" r="150" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="8,8"/>
    
    <!-- 定制模块 - 使用简洁的几何形状 -->
    <!-- 模块1 - 左上 -->
    <g transform="translate(-120, -80)">
      <rect x="-40" y="-30" width="80" height="60" rx="8" fill="white" stroke="#3B82F6" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" fill="#3B82F6" font-family="Arial" font-size="14" font-weight="bold">功能</text>
    </g>
    
    <!-- 模块2 - 右上 -->
    <g transform="translate(120, -80)">
      <rect x="-40" y="-30" width="80" height="60" rx="8" fill="white" stroke="#3B82F6" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" fill="#3B82F6" font-family="Arial" font-size="14" font-weight="bold">界面</text>
    </g>
    
    <!-- 模块3 - 左下 -->
    <g transform="translate(-120, 80)">
      <rect x="-40" y="-30" width="80" height="60" rx="8" fill="white" stroke="#3B82F6" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" fill="#3B82F6" font-family="Arial" font-size="14" font-weight="bold">数据</text>
    </g>
    
    <!-- 模块4 - 右下 -->
    <g transform="translate(120, 80)">
      <rect x="-40" y="-30" width="80" height="60" rx="8" fill="white" stroke="#3B82F6" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" fill="#3B82F6" font-family="Arial" font-size="14" font-weight="bold">集成</text>
    </g>
  </g>
  
  <!-- 连接线 - 简化为直线 -->
  <g stroke="#3B82F6" stroke-width="2" stroke-dasharray="5,5">
    <line x1="330" y1="120" x2="415" y2="160" />
    <line x1="330" y1="280" x2="415" y2="240" />
    <line x1="570" y1="120" x2="485" y2="160" />
    <line x1="570" y1="280" x2="485" y2="240" />
  </g>
  
  <!-- 装饰元素 - 简洁的几何形状 -->
  <circle cx="250" cy="100" r="15" fill="#3B82F6" opacity="0.2"/>
  <circle cx="650" cy="100" r="15" fill="#3B82F6" opacity="0.2"/>
  <circle cx="250" cy="300" r="15" fill="#3B82F6" opacity="0.2"/>
  <circle cx="650" cy="300" r="15" fill="#3B82F6" opacity="0.2"/>
  
  <!-- 动态效果 - 简化的脉冲圆圈 -->
  <circle cx="450" cy="200" r="180" stroke="#3B82F6" stroke-width="1" fill="none" opacity="0.1"/>
  <circle cx="450" cy="200" r="210" stroke="#3B82F6" stroke-width="1" fill="none" opacity="0.05"/>
  
  <!-- 标题 -->
  <text x="450" y="370" text-anchor="middle" fill="#1E293B" font-family="Arial" font-size="22" font-weight="bold">定制AI工作台</text>
  <text x="450" y="395" text-anchor="middle" fill="#3B82F6" font-family="Arial" font-size="14">个性化功能 · 系统集成 · 业务适配</text>
</svg>
